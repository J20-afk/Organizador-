  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>❤️ I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .info {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 100, 150, 0.5);
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
        }

        .top-image {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            width: min(220px, calc(100vw - 32px));
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 140, 180, 0.3);
            box-shadow: 0 0 22px rgba(255, 80, 150, 0.22);
            background: rgba(20, 5, 12, 0.35);
        }

        .top-image img {
            display: block;
            width: 100%;
            height: auto;
        }

        .music-player {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: min(520px, calc(100vw - 32px));
            padding: 14px 18px;
            border-radius: 999px;
            background: rgba(20, 5, 12, 0.72);
            border: 1px solid rgba(255, 120, 170, 0.28);
            box-shadow: 0 0 24px rgba(255, 80, 150, 0.18), inset 0 0 18px rgba(255, 80, 150, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .music-player button {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6aa8, #ff9bc1);
            color: #16060d;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            flex: 0 0 auto;
            box-shadow: 0 0 18px rgba(255, 110, 170, 0.45);
        }

        .music-player button:active {
            transform: scale(0.98);
        }

        .music-player .track {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .music-player .title {
            color: rgba(255, 215, 230, 0.92);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ocultar el reproductor de YouTube real detrás de la pantalla */
        #yt-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div id="yt-player"></div>

    <div class="top-image">
        <img src="https://i.pinimg.com/736x/a7/a1/80/a7a180e8c8f2979245d3df096a235263.jpg" alt="Imagen" />
    </div>

    <div class="info">HNOS ❤️ J & A ❤️ POR SIEMPRE</div>

    <div class="music-player">
        <button id="playBtn" type="button">▶</button>
        <div class="track">
            <div class="title">Vámonos a Marte - Kevin Kaarl 🚀</div>
            <div style="color: rgba(255, 180, 205, 0.85); font-size: 11px; text-align: center; margin-top: 4px;">
                ¡Toca Play para activar la música!
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const playBtn = document.getElementById("playBtn");

        let W, H, CX, CY, SCALE;
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        const phrase = "i love you";
        const points = [];
        const TOTAL = 150;

        // Cargar la API oficial de YouTube de fondo
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: 'M7-P0Gbe2jE', // ID de Vámonos a Marte en YouTube
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'M7-P0Gbe2jE'
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // El reproductor está listo de fondo
        }

        playBtn.addEventListener("click", () => {
            if (!player || typeof player.playVideo !== 'function') return;

            if (!isPlaying) {
                player.playVideo();
                playBtn.textContent = "❚❚";
                isPlaying = true;
            } else {
                player.pauseVideo();
                playBtn.textContent = "▶";
                isPlaying = false;
            }
        });

        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * DPR; canvas.height = H * DPR;
            canvas.style.width = W + "px"; canvas.style.height = H + "px";
            ctx.scale(DPR, DPR);
            CX = W / 2; CY = H / 2 + 20;
            SCALE = Math.min(W, H) * 0.014;
            buildPoints();
        }

        function heart(t) {
            return { x: 16 * Math.pow(Math.sin(t), 3) * SCALE, y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * SCALE };
        }

        function buildPoints() {
            points.length = 0;
            for (let i = 0; i < TOTAL; i++) {
                const t = (Math.PI * 2 * i) / TOTAL;
                points.push({ ...heart(t), offset: Math.random() * Math.PI * 2 });
            }
        }

        function drawWord(word, x, y, time) {
            const pulse = Math.sin(time * 2) * 2;
            ctx.save(); ctx.translate(x, y);
            for (let s = 3; s >= 0; s--) {
                ctx.shadowBlur = s * 8; ctx.shadowColor = `rgba(255, 80, 150, ${0.7 - s * 0.15})`;
                ctx.font = `${11 + pulse + s}px Arial`;
                ctx.fillStyle = s === 0 ? "white" : `rgba(255, 100, 160, 0.35)`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(word, 0, 0);
            }
            ctx.restore();
        }

        function animate(time = 0) {
            time *= 0.001; ctx.clearRect(0, 0, W, H);
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const x = CX + points[i].x, y = CY + points[i].y;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.strokeStyle = "rgba(255, 50, 120, 0.25)"; ctx.lineWidth = 2; ctx.stroke();

            for (let i = 0; i < points.length; i++) {
                const wave = Math.sin(time * 2 + points[i].offset) * 4;
                drawWord(phrase, CX + points[i].x, CY + points[i].y + wave, time);
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", resize);
        resize(); animate();
    </script>
</body>
</html>
